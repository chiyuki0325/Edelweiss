<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Telegram module architecture</title>
  <desc id="desc">Layered architecture diagram for the Telegram module, showing platform clients, manager, live ingress, driver egress, persistence, media, pipeline, and driver flows.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .band { fill: #ffffff; stroke: #d7dde7; stroke-width: 1.5; }
      .band-title { fill: #475569; font: 600 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .box { rx: 8; ry: 8; stroke-width: 1.6; }
      .platform { fill: #eef6ff; stroke: #93c5fd; }
      .core { fill: #f1f5f9; stroke: #94a3b8; }
      .ingress { fill: #ecfdf5; stroke: #6ee7b7; }
      .egress { fill: #fff7ed; stroke: #fdba74; }
      .state { fill: #f5f3ff; stroke: #c4b5fd; }
      .media { fill: #fefce8; stroke: #fde68a; }
      .external { fill: #fdf2f8; stroke: #f9a8d4; }
      .title { fill: #0f172a; font: 700 17px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .sub { fill: #475569; font: 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .small { fill: #64748b; font: 11px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .edge { fill: none; stroke: #4b5563; stroke-width: 2; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .edge-green { fill: none; stroke: #047857; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .edge-orange { fill: none; stroke: #b45309; stroke-width: 2.2; marker-end: url(#arrowOrange); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .label-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 5; ry: 5; }
      .label { fill: #334155; font: 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .legend-title { fill: #0f172a; font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="820"/>

  <text x="56" y="48" class="title" style="font-size:24px">Telegram Module Architecture</text>
  <text x="56" y="72" class="sub">Readable boundary view: platform clients feed manager; live ingress and driver egress share the event sink, stores, media, Pipeline, and Driver.</text>

  <rect class="band" x="40" y="100" width="1200" height="120" rx="12" ry="12"/>
  <text x="58" y="124" class="band-title">Platform Clients</text>

  <rect class="band" x="40" y="250" width="1200" height="150" rx="12" ry="12"/>
  <text x="58" y="274" class="band-title">Telegram Core</text>

  <rect class="band" x="40" y="430" width="1200" height="170" rx="12" ry="12"/>
  <text x="58" y="454" class="band-title">Runtime Adapters</text>

  <rect class="band" x="40" y="630" width="1200" height="130" rx="12" ry="12"/>
  <text x="58" y="654" class="band-title">Application Ports</text>

  <rect class="box platform" x="92" y="138" width="190" height="58"/>
  <text x="112" y="163" class="title">Bot API</text>
  <text x="112" y="183" class="sub">grammY bot client</text>

  <rect class="box platform" x="330" y="138" width="190" height="58"/>
  <text x="350" y="163" class="title">User API</text>
  <text x="350" y="183" class="sub">gramjs userbot</text>

  <rect class="box external" x="820" y="138" width="210" height="58"/>
  <text x="840" y="163" class="title">Telegram Network</text>
  <text x="840" y="183" class="sub">messages, edits, media, reactions</text>

  <rect class="box core" x="130" y="292" width="250" height="78"/>
  <text x="150" y="319" class="title">TelegramManager</text>
  <text x="150" y="340" class="sub">clients, dedup, ingress queue</text>
  <text x="150" y="358" class="small">blocking media transforms + typing polling</text>

  <rect class="box media" x="470" y="292" width="230" height="78"/>
  <text x="490" y="319" class="title">Media Resolvers</text>
  <text x="490" y="340" class="sub">image / animation / custom emoji</text>
  <text x="490" y="358" class="small">cache lookup, frame extraction, alt text</text>

  <rect class="box state" x="790" y="292" width="230" height="78"/>
  <text x="810" y="319" class="title">DI Container</text>
  <text x="810" y="340" class="sub">focused Telegram tokens</text>
  <text x="810" y="358" class="small">manager, sink, handlers, hooks, tasks</text>

  <rect class="box ingress" x="90" y="482" width="220" height="76"/>
  <text x="110" y="510" class="title">Live Handlers</text>
  <text x="110" y="531" class="sub">adapt, redact, commands</text>
  <text x="110" y="549" class="small">messages, edits, deletes, reactions, typing</text>

  <rect class="box egress" x="382" y="482" width="220" height="76"/>
  <text x="402" y="510" class="title">Driver Hooks</text>
  <text x="402" y="531" class="sub">send, download, react</text>
  <text x="402" y="549" class="small">synthetic self-message injection</text>

  <rect class="box ingress" x="672" y="482" width="220" height="76"/>
  <text x="692" y="510" class="title">Event Sink</text>
  <text x="692" y="531" class="sub">persist, hydrate, publish</text>
  <text x="692" y="549" class="small">separates persist() and publish()</text>

  <rect class="box egress" x="964" y="482" width="220" height="76"/>
  <text x="984" y="510" class="title">Post-Startup Tasks</text>
  <text x="984" y="531" class="sub">historical backfills</text>
  <text x="984" y="549" class="small">animation hashes + custom emoji replay</text>

  <rect class="box state" x="86" y="682" width="190" height="56"/>
  <text x="106" y="706" class="title">DB Stores</text>
  <text x="106" y="726" class="sub">events, messages, reactions</text>

  <rect class="box state" x="340" y="682" width="190" height="56"/>
  <text x="360" y="706" class="title">Pipeline</text>
  <text x="360" y="726" class="sub">Projection + Rendering</text>

  <rect class="box state" x="594" y="682" width="190" height="56"/>
  <text x="614" y="706" class="title">Driver</text>
  <text x="614" y="726" class="sub">debounce, LLM, tools</text>

  <rect class="box media" x="848" y="682" width="190" height="56"/>
  <text x="868" y="706" class="title">Alt Text Cache</text>
  <text x="868" y="726" class="sub">image_alt_texts</text>

  <path class="edge" d="M 820 167 C 690 158, 620 158, 520 167"/>
  <rect class="label-bg" x="608" y="142" width="126" height="24"/>
  <text x="620" y="159" class="label">updates + media</text>

  <path class="edge" d="M 282 167 C 310 167, 315 167, 330 167"/>
  <path class="edge" d="M 425 196 C 415 232, 350 258, 286 292"/>
  <path class="edge" d="M 187 196 C 190 232, 215 258, 238 292"/>
  <rect class="label-bg" x="256" y="226" width="150" height="24"/>
  <text x="268" y="243" class="label">raw Telegram events</text>

  <path class="edge-dashed" d="M 380 330 C 410 328, 438 326, 470 326"/>
  <rect class="label-bg" x="398" y="300" width="132" height="24"/>
  <text x="410" y="317" class="label">blocking alt text</text>

  <path class="edge-dashed" d="M 790 330 C 760 330, 730 330, 700 330"/>
  <path class="edge-dashed" d="M 790 350 C 650 410, 555 448, 492 482"/>
  <path class="edge-dashed" d="M 790 350 C 620 398, 318 420, 200 482"/>
  <path class="edge-dashed" d="M 905 370 C 975 410, 1030 438, 1074 482"/>
  <rect class="label-bg" x="730" y="390" width="126" height="24"/>
  <text x="742" y="407" class="label">factory wiring</text>

  <path class="edge-green" d="M 255 370 C 240 412, 218 446, 204 482"/>
  <rect class="label-bg" x="178" y="410" width="116" height="24"/>
  <text x="190" y="427" class="label">manager events</text>

  <path class="edge-orange" d="M 492 482 C 438 430, 360 388, 300 370"/>
  <rect class="label-bg" x="348" y="415" width="98" height="24"/>
  <text x="360" y="432" class="label">send calls</text>

  <path class="edge-green" d="M 310 520 L 672 520"/>
  <rect class="label-bg" x="432" y="492" width="112" height="24"/>
  <text x="444" y="509" class="label">canonical event</text>

  <path class="edge-orange" d="M 602 520 L 672 520"/>
  <rect class="label-bg" x="593" y="536" width="96" height="24"/>
  <text x="605" y="553" class="label">self event</text>

  <path class="edge" d="M 202 558 C 192 608, 184 640, 181 682"/>
  <rect class="label-bg" x="94" y="606" width="152" height="24"/>
  <text x="106" y="623" class="label">message/reaction rows</text>

  <path class="edge-blue" d="M 782 558 C 705 624, 540 644, 435 682"/>
  <rect class="label-bg" x="570" y="612" width="108" height="24"/>
  <text x="582" y="629" class="label">push event</text>

  <path class="edge-blue" d="M 782 558 C 760 616, 725 646, 689 682"/>
  <rect class="label-bg" x="704" y="612" width="110" height="24"/>
  <text x="716" y="629" class="label">notify Driver</text>

  <path class="edge" d="M 782 558 C 842 610, 904 638, 943 682"/>
  <rect class="label-bg" x="832" y="604" width="116" height="24"/>
  <text x="844" y="621" class="label">hydrate cached</text>

  <path class="edge-orange" d="M 690 682 C 640 620, 555 584, 492 558"/>
  <rect class="label-bg" x="550" y="610" width="112" height="24"/>
  <text x="562" y="627" class="label">tool egress</text>

  <path class="edge" d="M 1074 558 C 1050 610, 1000 642, 943 682"/>
  <path class="edge" d="M 1074 558 C 980 624, 560 650, 435 682"/>
  <rect class="label-bg" x="990" y="608" width="116" height="24"/>
  <text x="1002" y="625" class="label">backfill + replay</text>

  <rect class="band" x="1058" y="650" width="148" height="88" rx="8" ry="8"/>
  <text x="1074" y="674" class="legend-title">Line meaning</text>
  <path class="edge-green" d="M 1076 692 L 1128 692"/>
  <text x="1140" y="696" class="small">ingress</text>
  <path class="edge-orange" d="M 1076 715 L 1128 715"/>
  <text x="1140" y="719" class="small">egress</text>
  <path class="edge-blue" d="M 1076 738 L 1128 738"/>
  <text x="1140" y="742" class="small">pipeline/driver</text>
</svg>
