models:
  primary:
    apiBaseUrl: ""
    apiKey: ""
    model: "claude-opus-4-6"
    # apiFormat: "responses"        # optional: 'openai-chat' (default), 'responses', or 'anthropic-messages'
    # timeoutSec: 120                # optional: abort requests that stream for too long
    # maxImagesAllowed: 100     # optional: drop oldest images when context exceeds this limit
    # extraBody:                     # optional: shallow-merged into the provider request body. Schema is
    #                                # the raw provider schema — match it to apiFormat above. Examples:
    #   reasoning_effort: "high"     #   openai-chat: GPT/DeepSeek/Kimi reasoning knob.
    #   thinking:                    #   anthropic-messages: enable Claude thinking; bump max_tokens accordingly.
    #     type: "enabled"
    #     budget_tokens: 10000
    #   max_tokens: 16000
    #   reasoning:                   #   responses: GPT effort + summary opt-in (summary is required to surface reasoning text).
    #     effort: "low"
    #     summary: "auto"
    # forceToolCall: false             # force the model to always call a tool
telegram:
  botToken: ""
  apiId: 0
  apiHash: ""
  session: ""

# OneBot 11 (reverse WebSocket) — QQ platform integration.
# When enabled, the bot starts a WebSocket server and waits for a QQ client
# (NapCatQQ, LLOneBot, etc.) to connect. Each chat's platform field in the
# chats section determines whether it's a Telegram or QQ chat.
onebot:
  enabled: false
  host: "0.0.0.0"               # listen address
  port: 3001                     # WebSocket server port
  accessToken: ""               # optional: Bearer token for client authentication

database:
  path: "./data/cahciua.db"

# Runtime configuration: shell and file I/O commands used by tools.
# These are global (not per-chat) because they describe the execution environment.
runtime:
  shell: ["/bin/bash", "-c"]                                   # command prefix for bash tool
  writeFile: ["/bin/bash", "-c", "/usr/bin/cat > \"$0\""]      # write stdin to file (path appended as arg); required
  readFile: ["/usr/bin/cat"]                                   # read file to stdout (path appended as arg); required
  # writeFileSizeLimit: 20971520                               # max bytes for download_file (default 20 MB)
  # readFileSizeLimit: 20971520                                # max bytes for runtime.readFile consumers (send_message attachments, read_image)

# Per-chat configuration. Keys (except "default") serve as the chat ID whitelist.
# Each per-chat entry is deep-merged with "default" — only specify overrides.
chats:
  default:
    platform: telegram          # 'telegram' (default) or 'onebot'
    model: "primary"            # references a key in models
    # systemFiles:              # identity files injected into the system prompt (read at startup)
    #   - "./prompts/IDENTITY.md"
    #   - "./prompts/SOUL.md"
    compaction:
      maxContextEstTokens: 512000    # high water mark: trigger compaction when estimated context exceeds this
      workingWindowEstTokens: 8000   # low water mark: how many estimated tokens of raw content to retain after compaction
      # model: "primary"           # optional: override model for compaction calls (defaults to chat model)
    imageToText:
      enabled: false
      model: "primary"            # references a key in models
      # compress: true             # resize image-to-text inputs before calling the model (stickers always compress)
      # pixelBudget: 262144        # max pixels when compress=true (default 512*512)
    animationToText:
      enabled: false
      model: "primary"            # references a key in models
      # maxFrames: 5              # max equidistant frames to extract (default 5)
    customEmojiToText:
      enabled: false
      model: "primary"            # references a key in models
      # maxFrames: 5              # max equidistant frames for animated custom emoji (default 5)
    # Human-likeness heuristics: each check can be disabled independently (all enabled by default).
    # These feed the late-binding feedback XML that nudges the model toward more natural phrasing.
    # humanLikeness:
    #   trailingPeriod: true          # flag messages ending with a full stop
    #   denseClausePunctuation: true  # flag short messages packed with clause punctuation
    #   multipleMarkdownBold: true    # flag more than one **bold** span
    #   markdownList: true            # flag Markdown lists
    #   markdownHeader: true          # flag Markdown headers
    #   newline: true                 # flag any newline in a send_message
    #   notErshi: true                # flag when >50% of recent send_message contain "不是…而是…" pattern
    # Tools: configuration for enabled tools.
    tools:
      # bash:
      #   backgroundThresholdSec: 10               # timeout threshold above which bash runs as background task
      #   compactOutput: false                     # pipe output through rtk for token savings (requires rtk in PATH)
      webSearch:
        tavilyKey: ""                              # Tavily API key for web search (required)
      # webFetch: present = web_fetch tool enabled (omit to disable). Telegram
      # Instant View is tried first when a userbot is available; Jina is fallback.
      # webFetch:
      #   provider: "jina"                         # currently only 'jina' (https://r.jina.ai)
      #   jina:
      #     apiKey: ""                             # optional; raises rate limit and unlocks proxy pool
    # Subagent config
    # subagents:
    #   enabled: true
    #   model: primary
    #   maxConcurrent: 2
    #   maxSteps: 8

  # Per-chat overrides — uncomment and customize:
  # "751414718":                   # per-chat partial override (deep-merged with default)
  #   model: "secondary"
  # "-1002173016093": {}           # whitelisted Telegram group with all defaults
  # "987654321":                   # QQ group (OneBot)
  #   platform: onebot
  # "private:123456": {}           # QQ private chat with all defaults
